name: Tag Terraform Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Module version (e.g., 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-tag:
    name: Create Git Tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version. Use 1.0.0 or v1.0.0"
            exit 1
          fi

      - name: Set tag version
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        run: |
          git fetch --tags
          if git rev-parse -q --verify \
            "refs/tags/${{ steps.tag.outputs.tag }}" >/dev/null; then
            echo "Tag already exists!"
            exit 1
          fi

      - name: Create and push tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Terraform module release $TAG"
          git push origin "$TAG"

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "## Terraform Module Release" >> "$GITHUB_STEP_SUMMARY"
          echo "Created tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
